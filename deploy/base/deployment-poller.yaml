apiVersion: apps/v1
kind: Deployment
metadata:
  name: wahlergebnisse-poller
  namespace: wahlergebnisse
  labels:
    app.kubernetes.io/name: wahlergebnisse-poller
    app.kubernetes.io/part-of: wahlergebnisse
    app.kubernetes.io/component: poller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wahlergebnisse-poller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wahlergebnisse-poller
        app.kubernetes.io/part-of: wahlergebnisse
        app.kubernetes.io/component: poller
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wahlergebnisse
          image: ghcr.io/levino/wahlergebnisse:latest
          ports:
            - containerPort: 8080
          env:
            - name: WAHLEN_ROLLE
              value: poller
            - name: PORT
              value: "8080"
            - name: DATABASE_PATH
              value: /data/wahlen.db
            - name: PUBLIC_SITE_URL
              value: https://wahlergebnisse.levinkeller.de
            - name: EXPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wahlergebnisse-export
                  key: token
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wahlergebnisse-openai
                  key: token
                  optional: true
            - name: ANSAGEN_JE_MINUTE
              value: "5"
            - name: ANSAGEN_JE_STUNDE
              value: "30"
            - name: MODERATIONEN_JE_MINUTE
              value: "5"
            - name: MODERATIONEN_JE_STUNDE
              value: "30"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 2
            failureThreshold: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wahlergebnisse-data
