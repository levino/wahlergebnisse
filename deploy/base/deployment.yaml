apiVersion: apps/v1
kind: Deployment
metadata:
  name: wahlergebnisse
  namespace: wahlergebnisse
  labels:
    app.kubernetes.io/name: wahlergebnisse
spec:
  # SQLite ist single-writer, und der Poller soll nur einmal laufen:
  # genau eine Replica, Recreate statt RollingUpdate.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wahlergebnisse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wahlergebnisse
    spec:
      # ghcr.io/levino/wahlergebnisse ist öffentlich – kein imagePullSecret nötig.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wahlergebnisse
          image: ghcr.io/levino/wahlergebnisse:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_PATH
              value: /data/wahlen.db
            - name: PUBLIC_SITE_URL
              value: https://wahlergebnisse.levinkeller.de
            # Der Abfragetakt steht nicht mehr hier: Seit dem Ausbau auf 45
            # Kreise staffelt die App ihn selbst nach Wahltag, Tageszeit und
            # dem Kreis, den gerade jemand ansieht (src/lib/takt.ts). Feste
            # Werte an dieser Stelle wären das Vielfache der Grundlast.
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wahlergebnisse-data
