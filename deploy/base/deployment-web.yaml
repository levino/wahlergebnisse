apiVersion: apps/v1
kind: Deployment
metadata:
  name: wahlergebnisse
  namespace: wahlergebnisse
  labels:
    app.kubernetes.io/name: wahlergebnisse
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wahlergebnisse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wahlergebnisse
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wahlergebnisse
          image: ghcr.io/levino/wahlergebnisse:latest
          ports:
            - containerPort: 8080
          env:
            - name: WAHLEN_ROLLE
              value: web
            - name: PORT
              value: "8080"
            - name: DATABASE_PATH
              value: /data/wahlen.db
            - name: PUBLIC_SITE_URL
              value: https://wahlergebnisse.levinkeller.de
            - name: EXPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wahlergebnisse-export
                  key: token
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wahlergebnisse-openai
                  key: token
                  optional: true
            - name: ANSAGEN_JE_MINUTE
              value: "15"
            - name: ANSAGEN_JE_STUNDE
              value: "100"
            - name: MODERATIONEN_JE_MINUTE
              value: "15"
            - name: MODERATIONEN_JE_STUNDE
              value: "100"
          lifecycle:
            preStop:
              sleep:
                seconds: 8
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 2
            failureThreshold: 90
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wahlergebnisse-data
