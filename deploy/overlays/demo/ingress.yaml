# Eigene Adresse, eigenes Zertifikat, eigener Namespace in der
# Middleware-Referenz – die trägt den Namespace als Text und wird von
# `namespace:` nicht mitgezogen.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  namespace: wahlergebnisse
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: wahlergebnisse
  name: wahlergebnisse
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: wahlergebnisse-demo-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - demo.wahlergebnisse.levinkeller.de
      secretName: wahlergebnisse-demo-tls
  rules:
    - host: demo.wahlergebnisse.levinkeller.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wahlergebnisse
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  namespace: wahlergebnisse
  name: ratelimit-ansage
spec:
  rateLimit:
    average: 120
    period: 1m
    burst: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: wahlergebnisse
  name: wahlergebnisse-ansage
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: wahlergebnisse-demo-redirect-https@kubernetescrd,wahlergebnisse-demo-ratelimit-ansage@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - demo.wahlergebnisse.levinkeller.de
      secretName: wahlergebnisse-demo-tls
  rules:
    - host: demo.wahlergebnisse.levinkeller.de
      http:
        paths:
          - path: /api/ansage
            pathType: Prefix
            backend:
              service:
                name: wahlergebnisse
                port:
                  number: 80
