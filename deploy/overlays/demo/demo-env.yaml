# Der Schalter, der aus der Anwendung eine Generalprobe macht.
#
# Beide Rollen brauchen ihn: Der Poller spielt damit den Wahlabend von 2021
# nach statt abzufragen (server/main.ts), die Web-Pods setzen Banner und
# `noindex` (src/layouts/Layout.astro) und kennen nur Termine bis zum
# 12.09.2021 (src/data/termine.ts). Stünde er nur beim Poller, sähe die Seite
# echt aus und wäre es nicht – der gefährlichste aller Zustände, und sie böte
# 2026 an, wo nichts gespielt wird.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: wahlergebnisse
  name: wahlergebnisse-poller
spec:
  template:
    spec:
      containers:
        - name: wahlergebnisse
          env:
            - name: WAHLEN_DEMO
              value: "1"
            - name: WAHLEN_DEMO_ZYKLUS
              value: "3600"
            - name: PUBLIC_SITE_URL
              value: https://demo.wahlergebnisse.levinkeller.de
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: wahlergebnisse
  name: wahlergebnisse
spec:
  template:
    spec:
      containers:
        - name: wahlergebnisse
          env:
            - name: WAHLEN_DEMO
              value: "1"
            - name: PUBLIC_SITE_URL
              value: https://demo.wahlergebnisse.levinkeller.de
