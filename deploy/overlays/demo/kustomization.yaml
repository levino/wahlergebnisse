# Die Generalprobe: dieselbe Anwendung, dasselbe Image, andere Datenquelle.
#
# Sie fragt keine Wahlleitung ab. Sie spielt den Wahlabend der Kommunalwahl
# 2021 noch einmal durch – verrauscht, zeitlich gestaffelt und in einer
# Schleife. Spätere Termine kennt sie nicht (docs/demo.md).
#
# **Ohne Export-Token.** Das Sealed Secret der Produktion ist an ihren
# Namespace gebunden und ließe sich hier gar nicht entsiegeln; der Export ist
# ohne Token abgeschaltet, und eine Demo braucht ihn nicht. Es wird deshalb
# ausdrücklich wieder entfernt (`$patch: delete`) – sichtbar, statt still zu
# fehlen.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wahlergebnisse-demo
resources:
- namespace.yaml
- ../../base
- openai.sealed.yaml
# Die Patches nennen `namespace: wahlergebnisse` – den der Vorlage. Kustomize
# wendet sie an, bevor `namespace:` oben alles umschreibt; ohne die Angabe
# fänden sie ihr Ziel nicht.
patches:
- path: demo-env.yaml
- path: ingress.yaml
- path: ohne-export-token.yaml
images:
- name: ghcr.io/levino/wahlergebnisse
  newName: ghcr.io/levino/wahlergebnisse
  newTag: 04fda3b3f7fcd4dacb6f2d18e80df8b381b70212
