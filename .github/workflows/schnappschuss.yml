name: Ausgangsbestand veröffentlichen

on:
  workflow_dispatch:
    inputs:
      quelle:
        description: "URL des Export-Endpunkts"
        default: https://wahlergebnisse.levinkeller.de/export/wahlen.sqlite
        required: true
      marke:
        description: "Release-Name (leer = daten-<heute>)"
        default: ""
        required: false
      stufe:
        description: "zstd-Stufe"
        default: "19"
        required: false

permissions:
  contents: write

jobs:
  ziehen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bestand holen
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          QUELLE: ${{ inputs.quelle }}
        run: |
          set -euo pipefail
          if [ -z "${EXPORT_TOKEN:-}" ]; then
            echo "EXPORT_TOKEN fehlt – ohne ihn antwortet der Endpunkt mit 404." >&2
            exit 1
          fi
          curl -fsSL --retry 3 -H "Authorization: Bearer ${EXPORT_TOKEN}" \
            "$QUELLE" -o wahlen.db
          ls -l wahlen.db

      - name: Packen
        env:
          STUFE: ${{ inputs.stufe }}
        run: |
          set -euo pipefail
          npm run --silent schnappschuss -- --packen wahlen.db --ziel wahlen.db.zst \
            --stufe "$STUFE" | tee packen.log

      - name: Gegenprobe – lässt sich der Schnappschuss wieder lesen?
        run: npm run schnappschuss -- --pruefen wahlen.db.zst

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKE: ${{ inputs.marke }}
        run: |
          set -euo pipefail
          marke="${MARKE:-}"
          [ -n "$marke" ] || marke="daten-$(date -u +%Y-%m-%d)"
          {
            cat packen.log
            echo
            echo "Eingebacken wird dieser Anhang über \`ARG SCHNAPPSCHUSS=$marke\` im Dockerfile."
            echo "Der Dateiname \`wahlen.db.zst\` ist Teil der Adresse, unter der der Build ihn sucht, und darf sich nicht ändern."
          } > notizen.md
          gh release create "$marke" wahlen.db.zst \
            --title "Ausgangsbestand $marke" --notes-file notizen.md \
            || gh release upload "$marke" wahlen.db.zst --clobber
          echo "Jetzt im Dockerfile eintragen: ARG SCHNAPPSCHUSS=$marke"
