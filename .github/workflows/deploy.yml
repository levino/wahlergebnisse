name: Deploy

# Baut das Image auf einem ARM-Runner (die Cluster-Architektur, kein QEMU),
# schiebt es nach GHCR und trägt den Tag ins Produktions-Overlay ein. Argo CD
# rollt den Commit dann aus – die CI selbst hat keinen Cluster-Zugriff.
on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/overlays/production/kustomization.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/levino/wahlergebnisse

jobs:
  bauen-und-eintragen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag ins Overlay eintragen
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_arm64.tar.gz | tar xz -C /tmp
          cd deploy/overlays/production
          /tmp/kustomize edit set image "${IMAGE}=${IMAGE}:${GITHUB_SHA}"
          cd -
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Mehrere Läufe können sich überholen: neu holen und erneut versuchen.
          for versuch in 1 2 3 4 5; do
            git fetch origin main
            git stash --include-untracked --quiet || true
            git reset --hard origin/main
            git stash pop --quiet || true
            cd deploy/overlays/production
            /tmp/kustomize edit set image "${IMAGE}=${IMAGE}:${GITHUB_SHA}"
            cd -
            if git diff --quiet; then
              echo "Tag unverändert."
              exit 0
            fi
            git commit -am "ci: Image ${GITHUB_SHA} ausrollen [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push-Rennen bei Versuch ${versuch}, neuer Anlauf …"
            sleep $((RANDOM % 5 + 2))
          done
          echo "Tag konnte nicht eingetragen werden." >&2
          exit 1
