name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/levino/wahlergebnisse
  ZWEIG: ausgerollt

jobs:
  bauen-und-eintragen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Angehaltenes Ausrollen beachten
        env:
          ANLASS: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "+refs/heads/${ZWEIG}:refs/remotes/origin/${ZWEIG}"
          if ! git cat-file -e "origin/${ZWEIG}:ANGEHALTEN" 2>/dev/null; then
            echo "Kein Halt eingelegt."
            exit 0
          fi
          git show "origin/${ZWEIG}:ANGEHALTEN"
          if [ "${ANLASS}" = "workflow_dispatch" ]; then
            echo "Von Hand ausgelöst – dieser Lauf hebt den Halt auf."
            exit 0
          fi
          echo "::error::Ausrollen ist nach einem Zurückrollen angehalten. Ein Mensch gibt frei: gh workflow run deploy.yml --ref main"
          exit 1

      - id: kopf
        name: Kopf von main bestimmen
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          stand=$(git rev-parse origin/main)
          git checkout --detach "${stand}"
          echo "stand=${stand}" >> "$GITHUB_OUTPUT"
          echo "Ausgerollt wird der Kopf von main: ${stand} – $(git log -1 --format=%s "${stand}")"
          if [ "${stand}" != "${GITHUB_SHA}" ]; then
            echo "Ausgelöst hat ${GITHUB_SHA}; main steht inzwischen weiter."
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.kopf.outputs.stand }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bildstand auf den Ausrollzweig schreiben
        env:
          STAND: ${{ steps.kopf.outputs.stand }}
          ANLASS: ${{ github.event_name }}
        run: |
          set -euo pipefail
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_arm64.tar.gz | tar xz -C /tmp
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          titel=$(git log -1 --format=%s "${STAND}")
          kurz=$(git rev-parse --short "${STAND}")
          for versuch in 1 2 3 4 5; do
            git fetch --no-tags --force origin "+refs/heads/${ZWEIG}:refs/remotes/origin/${ZWEIG}"
            git checkout -B "${ZWEIG}" "origin/${ZWEIG}"
            if [ -f ANGEHALTEN ] && [ "${ANLASS}" != "workflow_dispatch" ]; then
              cat ANGEHALTEN
              echo "::error::Während dieses Laufs wurde zurückgerollt – ${kurz} wird nicht eingetragen. Ein Mensch gibt frei: gh workflow run deploy.yml --ref main"
              exit 1
            fi
            eingetragen=$(sed -n 's/^ *newTag: *//p' deploy/overlays/production/kustomization.yaml | head -1)
            if [ -n "${eingetragen}" ] && [ "${eingetragen}" != "${STAND}" ] \
               && git cat-file -e "${eingetragen}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "${STAND}" "${eingetragen}"; then
              echo "Auf ${ZWEIG} steht mit ${eingetragen} bereits ein neuerer Stand – ${kurz} wird nicht zurückgeschrieben."
              exit 0
            fi
            git rm -rq -- .
            git checkout "${STAND}" -- deploy
            for overlay in production demo; do
              ( cd "deploy/overlays/${overlay}" && /tmp/kustomize edit set image "${IMAGE}=${IMAGE}:${STAND}" )
            done
            git add -- deploy
            if git diff --quiet --cached; then
              echo "Bildstand unverändert, nichts einzutragen."
              exit 0
            fi
            git commit \
              --message "${kurz} ausrollen: ${titel}" \
              --message "main-Commit: ${STAND}" \
              --message "Bild: ${IMAGE}:${STAND}"
            if git push origin "${ZWEIG}"; then
              echo "Eingetragen: ${IMAGE}:${STAND}"
              git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
              jetzt=$(git rev-parse origin/main)
              if [ "${jetzt}" != "${STAND}" ]; then
                echo "main steht inzwischen auf ${jetzt} – dafür läuft ein eigener Lauf."
              fi
              exit 0
            fi
            echo "Push-Rennen bei Versuch ${versuch}, neuer Anlauf …"
            sleep $((RANDOM % 5 + 2))
          done
          echo "Bildstand konnte nicht eingetragen werden." >&2
          exit 1
