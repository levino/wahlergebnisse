name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ausrollen
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/levino/wahlergebnisse
  STAND: ${{ github.sha }}

jobs:
  bauen-und-eintragen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    # Der Schritt unten schreibt selbst nach main; ohne das rollte der Deploy
    # sich endlos weiter aus.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.STAND }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag in die Overlays eintragen
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_arm64.tar.gz | tar xz -C /tmp
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for versuch in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for overlay in production demo; do
              cd "deploy/overlays/${overlay}"
              /tmp/kustomize edit set image "${IMAGE}=${IMAGE}:${STAND}"
              cd -
            done
            if git diff --quiet; then
              echo "Tag unverändert."
              exit 0
            fi
            git commit -am "ci: Image ${STAND} ausrollen [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push-Rennen bei Versuch ${versuch}, neuer Anlauf …"
            sleep $((RANDOM % 5 + 2))
          done
          echo "Tag konnte nicht eingetragen werden." >&2
          exit 1
