name: Deploy

# Baut das Image auf einem ARM-Runner (die Cluster-Architektur, kein QEMU),
# schiebt es nach GHCR und trägt den Tag ins Produktions-Overlay ein. Argo CD
# rollt den Commit dann aus – die CI selbst hat keinen Cluster-Zugriff.
#
# Ausgelöst wird das erst, wenn die CI zu diesem Stand grün ist. Vorher hing
# der Deploy direkt am Push und hat auch kaputte Zwischenstände ausgerollt –
# bei einer Seite, die am Wahlabend laufen muss, ist das der falsche Weg
# herum.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Nacheinander, nicht nebeneinander: Zwei Läufe, die gleichzeitig den Tag ins
# Overlay schreiben wollen, rennen um denselben Commit auf main – einer verliert
# und der Lauf wird rot, obwohl nichts kaputt ist. Angestellt statt abgebrochen,
# weil sonst je nach Reihenfolge der ältere Stand gewinnen könnte.
concurrency:
  group: ausrollen
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/levino/wahlergebnisse
  # Bei workflow_run zeigt GITHUB_SHA auf den Workflow-Stand, nicht auf den
  # geprüften Commit – deshalb ausdrücklich der Kopf des CI-Laufs.
  STAND: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  bauen-und-eintragen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    # Von Hand angestoßen wird immer gebaut; automatisch nur nach grüner CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Den Stand bauen, den die CI geprüft hat – nicht den, der inzwischen
      # auf main liegt.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.STAND }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag ins Overlay eintragen
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_arm64.tar.gz | tar xz -C /tmp
          cd deploy/overlays/production
          /tmp/kustomize edit set image "${IMAGE}=${IMAGE}:${STAND}"
          cd -
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Mehrere Läufe können sich überholen: neu holen und erneut versuchen.
          for versuch in 1 2 3 4 5; do
            git fetch origin main
            git stash --include-untracked --quiet || true
            git reset --hard origin/main
            git stash pop --quiet || true
            cd deploy/overlays/production
            /tmp/kustomize edit set image "${IMAGE}=${IMAGE}:${STAND}"
            cd -
            if git diff --quiet; then
              echo "Tag unverändert."
              exit 0
            fi
            git commit -am "ci: Image ${STAND} ausrollen [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push-Rennen bei Versuch ${versuch}, neuer Anlauf …"
            sleep $((RANDOM % 5 + 2))
          done
          echo "Tag konnte nicht eingetragen werden." >&2
          exit 1
