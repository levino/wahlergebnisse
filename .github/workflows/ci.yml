name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Typen, Lint, Tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npx biome ci --diagnostic-level=error .
      - run: npm run check
      - run: npm test

  browser-teil:
    name: Browser-Teil ${{ matrix.teil.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        teil:
          - { name: neustart, args: --project=neustart }
          - { name: 1/3, args: --project=chromium --shard=1/3 }
          - { name: 2/3, args: --project=chromium --shard=2/3 }
          - { name: 3/3, args: --project=chromium --shard=3/3 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit --fund=false
      - id: pw
        run: echo "fassung=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.fassung }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: npm run e2e:ci -- ${{ matrix.teil.args }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7

  browser:
    name: Browser-Tests
    runs-on: ubuntu-24.04-arm
    needs: [browser-teil]
    # Ohne always() fiele dieser Job aus, sobald ein Teil rot ist – und eine
    # übersprungene Pflichtprüfung gilt der Branch Protection als erledigt.
    if: always()
    timeout-minutes: 5
    steps:
      - env:
          ERGEBNIS: ${{ needs.browser-teil.result }}
        run: |
          echo "Ergebnis aller Browser-Teile: ${ERGEBNIS}"
          if [ "${ERGEBNIS}" != "success" ]; then
            echo "::error::Mindestens ein Browser-Teil war nicht erfolgreich (${ERGEBNIS})."
            exit 1
          fi
